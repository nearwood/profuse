name: AUR publish

on:
  release:
    types: [published]
  # Re-publish an existing tag, or ship a packaging-only fix (pkgrel > 1).
  # PKGBUILDs come from the branch the run starts on; the version from the tag.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (e.g. v0.1.1)
        required: true
      pkgrel:
        description: pkgrel (bump for packaging-only changes)
        default: "1"
      package:
        description: Package(s) to publish
        type: choice
        options: [both, profuse, profuse-git]
        default: both

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  PKGREL: ${{ inputs.pkgrel || '1' }}
  PACKAGES: ${{ (inputs.package == 'profuse' || inputs.package == 'profuse-git') && inputs.package || 'profuse profuse-git' }}

jobs:
  publish:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm git openssh pacman-contrib

      - uses: actions/checkout@v6

      - name: Set up build user
        run: |
          useradd -m builder
          chown -R builder "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Update PKGBUILDs
        run: |
          case "$PKGREL" in
            ''|0*|*[!0-9]*) echo "::error::pkgrel must be a positive integer"; exit 1 ;;
          esac
          git fetch --depth=1 --force origin "refs/tags/$TAG:refs/tags/$TAG"
          ver="${TAG#v}"
          short="$(git rev-parse --short=7 "$TAG^{commit}")"

          cd contrib/aur/profuse
          sed -i "s/^pkgver=.*/pkgver=${ver}/; s/^pkgrel=.*/pkgrel=${PKGREL}/" PKGBUILD
          sudo -u builder updpkgsums
          sudo -u builder makepkg --printsrcinfo > .SRCINFO

          cd ../profuse-git
          sed -i "s/^pkgver=.*/pkgver=${ver}.r0.g${short}/; s/^pkgrel=.*/pkgrel=${PKGREL}/" PKGBUILD
          sudo -u builder makepkg --printsrcinfo > .SRCINFO

      # ssh resolves ~ from /etc/passwd (/root), not the container's $HOME,
      # so use explicit paths.
      - name: Set up SSH
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p /root/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" | tr -d '\r' > /root/.ssh/id_aur
          chmod 600 /root/.ssh/id_aur
          if ! ssh-keygen -y -P '' -f /root/.ssh/id_aur > /dev/null; then
            head -n1 /root/.ssh/id_aur | grep -q '^-----BEGIN .*PRIVATE KEY-----$' \
              && hint="has a private key header but won't load (truncated, or has a passphrase?)" \
              || hint="doesn't start with a private key header (public key pasted?)"
            echo "::error::AUR_SSH_PRIVATE_KEY $hint ($(wc -l < /root/.ssh/id_aur) lines)"
            exit 1
          fi
          ssh-keyscan aur.archlinux.org > /root/.ssh/known_hosts
          test -s /root/.ssh/known_hosts

      - name: Push to AUR
        env:
          GIT_SSH_COMMAND: ssh -i /root/.ssh/id_aur -o UserKnownHostsFile=/root/.ssh/known_hosts
          AUR_USERNAME: ${{ vars.AUR_USERNAME }}
          AUR_EMAIL: ${{ vars.AUR_EMAIL }}
        run: |
          push() {
            pkg="$1"
            dir="/tmp/aur-$pkg"
            git clone "ssh://aur@aur.archlinux.org/$pkg.git" "$dir"
            cp "contrib/aur/$pkg/PKGBUILD" "contrib/aur/$pkg/.SRCINFO" "$dir/"
            cd "$dir"
            git config user.name "$AUR_USERNAME"
            git config user.email "$AUR_EMAIL"
            git add PKGBUILD .SRCINFO
            if git diff --cached --quiet; then
              echo "$pkg: no changes"
            else
              git commit -m "Update to $TAG-$PKGREL"
              git push origin HEAD:master
            fi
            cd "$GITHUB_WORKSPACE"
          }
          for pkg in $PACKAGES; do push "$pkg"; done
