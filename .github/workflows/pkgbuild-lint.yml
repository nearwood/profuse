name: PKGBUILD lint

on:
  push:
    paths: [contrib/aur/**]
  pull_request:
    paths: [contrib/aur/**]

jobs:
  namcap:
    runs-on: ubuntu-latest
    container: archlinux:latest
    strategy:
      matrix:
        pkg: [profuse, profuse-git]
    steps:
      - uses: actions/checkout@v6
      - run: pacman -Sy --noconfirm namcap
      - run: namcap contrib/aur/${{ matrix.pkg }}/PKGBUILD
